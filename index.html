<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutsch Quiz</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b6b70;--card:#f1f1f5;--ac:#2f5bea;--ok:#1a8a4a;--bad:#c93b3b;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#ececef;--mut:#9a9aa2;--card:#23252a;--ac:#6f8cff;--ok:#4cc27f;--bad:#ef6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:24px}h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid transparent;border-radius:10px;padding:12px;cursor:pointer;text-align:left}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;text-align:center}
button small{display:block;color:var(--mut)}
input,select{background:var(--card);border:1px solid var(--mut);border-radius:8px;padding:8px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:12px 0}.row>*{flex:1;min-width:130px}
.cell{background:var(--card);border-radius:8px;padding:8px 10px;min-height:56px}
.cell small{color:var(--mut)}.cell b{display:block;min-height:1.3em}.cell.ok b{color:var(--ok)}.cell.miss b{color:var(--bad)}
#bar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;gap:12px;align-items:center;z-index:2}
#bar input{flex:1;font-size:18px}#t{font-variant-numeric:tabular-nums;font-size:20px;min-width:70px}
.hide{display:none}#msg{color:var(--mut);margin:8px 0}
</style></head><body><main>
<section id="home">
<h1>🇩🇪 Deutsch Quiz</h1>
<div class="row">
 <label>Direction<select id="dir"><option value="de">German → English (clue German)</option><option value="en">English → German (clue English)</option><option value="mix">Mixed</option></select></label>
 <label>Minutes<input id="min" type="number" value="10" min="1" max="60"></label>
</div>
<h2>By word type</h2><div class="grid" id="types"></div>
<h2>By topic</h2><div class="grid" id="topics"></div>
<div class="grid" style="margin-top:10px"><button id="tpB">🗂️ Add a topic</button><button id="tfB">📄 Add words file to a topic</button></div>
<div id="tp" class="hide"><div class="row"><label>Topic name<input id="tpn" placeholder="e.g. Travel"></label><label>Words file (optional)<input id="tpf" type="file" accept=".txt,.csv"></label><button class="p" id="tpg">Create topic</button></div></div>
<div id="tf" class="hide"><div class="row"><label>Topic<select id="tfs"></select></label><label>Words file<input id="tff" type="file" accept=".txt,.csv"></label><button class="p" id="tfg">Add words</button></div></div>
<h2>Tools</h2>
<div class="grid"><button id="addB">➕ Add a word</button><button id="setB">⚙️ GitHub sync settings</button></div>

<div id="add" class="hide"><h2>Add a word</h2>
 <div class="row"><label>German or English word<input id="w" placeholder="arbeiten  or  to work"></label>
 <label>Word type (optional)<select id="lt"></select></label><label>Topic (optional)<select id="lp"></select></label>
 <button class="p" id="go">Look up</button></div>
 <div id="prev" class="hide"><div class="row">
 <label>German<input id="pde"></label><label>English<input id="pen"></label>
 <label>Type<select id="pt"></select></label><label>Topic<select id="pp"></select></label><button class="p" id="save">Save</button></div></div>
</div>
<div id="set" class="hide"><h2>GitHub sync</h2>
 <p id="msg0" style="color:var(--mut)">Create a fine-grained token with “Contents: read &amp; write” on your repo only. It stays in this browser.</p>
 <div class="row"><label>Owner<input id="go1"></label><label>Repo<input id="go2"></label><label>Branch<input id="go3" value="main"></label></div>
 <div class="row"><label>Token<input id="go4" type="password"></label><button class="p" id="sset">Save settings</button></div></div>
<div id="msg"></div>
</section>

<section id="quiz" class="hide">
 <div id="bar"><span id="t"></span><input id="ans" placeholder="Type an answer…" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="sc"></span><button id="end">Give up</button></div>
 <h1 id="qt"></h1><div class="grid" id="cells"></div>
 <p><button id="back">← Back</button></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id), LS=localStorage;
let data, cur, timer;
const cfg=()=>JSON.parse(LS.cfg||'{}');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss')
  .replace(/^(to|the|a|an|der|die|das|ein|eine)\s+/,'').replace(/[^a-z0-9 ]/g,'').trim();
const alts=s=>s.split(/[\/;,]/).map(norm).filter(Boolean);
const lists=()=>({...data.types,...data.topics});
const msg=t=>$('msg').textContent=t||'';

const TYPES={verbs:'Verbs',nouns:'Nouns',adjectives:'Adjectives',adverbs:'Adverbs',misc:'Miscellaneous'};
const ADV=new Set(['nur','auch','sehr','immer','oft','heute','schon','vielleicht']);
const TOPIC_OF={arbeiten:'daily','die Arbeit':'daily','das Haus':'daily','die Familie':'daily','das Wasser':'daily','der Tag':'daily','die Nacht':'daily','das Kind':'daily','die Stadt':'daily','das Leben':'daily','der Freund':'daily','die Frau':'daily','der Mann':'daily','die Frage':'education'};
function guessType(de,en){
  if(/^to\s/i.test(en)||/^[a-zäöüß]+en$/.test(de))return 'verbs';
  if(/^(der|die|das)\s|^[A-ZÄÖÜ]/.test(de))return 'nouns';
  return ADV.has(de)?'adverbs':'adjectives';}
/* old format (types/topics lists) -> new format: one word list, every word has a type AND a topic */
function migrate(d){
  if(d.version===2){d.topics.misc=d.topics.misc||'Miscellaneous';return d;}
  const n={version:2,topics:{},words:[]};
  for(const k in d.topics)n.topics[k]=d.topics[k].title;
  n.topics.misc='Miscellaneous';
  const add=(de,en,type,topic)=>{const e=n.words.find(w=>w.de===de&&norm(w.en)===norm(en));
    if(e){if(e.topic==='misc')e.topic=topic;return;}n.words.push({de,en,type,topic});};
  for(const k in d.types)d.types[k].words.forEach(w=>add(w.de,w.en,k==='adjadv'?guessType(w.de,w.en):k,TOPIC_OF[w.de]||'misc'));
  for(const k in d.topics)d.topics[k].words.forEach(w=>add(w.de,w.en,guessType(w.de,w.en),k));
  return n;}
async function load(){
  const raw=await (await fetch('words.json?t='+Date.now())).json(), was=raw.version===2;
  data=migrate(raw);
  JSON.parse(LS.pending||'[]').forEach(o=>applyOp(data,o));
  render();
  const c=cfg();
  if(!was&&c.t&&c.o&&c.r){try{await gh(c,JSON.parse(LS.pending||'[]'));LS.pending='[]';msg('Word lists upgraded and saved to GitHub ✓');}catch(e){msg('Upgrade not saved to GitHub yet: '+e.message);}}
}
function mk(box,title,key,field){
  const n=data.words.filter(w=>w[field]===key).length,b=document.createElement('button');
  b.innerHTML=`${title}<small>${n} words</small>`;b.onclick=()=>start(title,data.words.filter(w=>w[field]===key));box.append(b);}
function render(){
  $('types').innerHTML='';$('topics').innerHTML='';
  for(const k in TYPES)mk($('types'),TYPES[k],k,'type');
  for(const k in data.topics)mk($('topics'),data.topics[k],k,'topic');
  const T=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const P=Object.entries(data.topics).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const A='<option value="">Auto-detect</option>';
  $('lt').innerHTML=A+T;$('lp').innerHTML=A+P;$('pt').innerHTML=T;$('pp').innerHTML=P;$('tfs').innerHTML=P;
}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* ---------- quiz ---------- */
function start(title,ws){
  if(!ws.length)return msg('No words here yet.');
  const d=$('dir').value;
  cur={items:shuffle(ws).map(w=>({w,clue:d==='mix'?(Math.random()<.5?'de':'en'):d,done:false})),left:+$('min').value*60,found:0};
  $('home').classList.add('hide');$('quiz').classList.remove('hide');
  $('qt').textContent=title; $('ans').value=''; $('ans').disabled=false; $('end').disabled=false;
  $('cells').innerHTML='';
  cur.items.forEach(it=>{const c=document.createElement('div');c.className='cell';
    c.innerHTML=`<small>${it.clue==='de'?it.w.de:it.w.en}</small><b></b>`;it.el=c;$('cells').append(c);});
  tick();clearInterval(timer);timer=setInterval(()=>{cur.left--;tick();if(cur.left<=0)finish();},1000);
  $('ans').focus();
}
function tick(){const m=Math.floor(cur.left/60),s=cur.left%60;$('t').textContent=m+':'+String(s).padStart(2,'0');
  $('sc').textContent=cur.found+'/'+cur.items.length;}
$('ans').oninput=e=>{
  const v=norm(e.target.value); if(!v)return;
  const it=cur.items.find(i=>!i.done&&alts(i.clue==='de'?i.w.en:i.w.de).includes(v));
  if(!it)return;
  it.done=true;cur.found++;it.el.classList.add('ok');it.el.querySelector('b').textContent=it.clue==='de'?it.w.en:it.w.de;
  e.target.value='';tick();if(cur.found===cur.items.length)finish();
};
function finish(){clearInterval(timer);$('ans').disabled=true;$('end').disabled=true;
  cur.items.forEach(i=>{if(!i.done){i.el.classList.add('miss');i.el.querySelector('b').textContent=i.clue==='de'?i.w.en:i.w.de;}});}
$('end').onclick=finish;
$('back').onclick=()=>{clearInterval(timer);$('quiz').classList.add('hide');$('home').classList.remove('hide');};
/* ---------- add word / topics ---------- */
const tg=id=>$(id).classList.toggle('hide');
$('addB').onclick=()=>tg('add');$('tpB').onclick=()=>tg('tp');$('tfB').onclick=()=>tg('tf');
$('setB').onclick=()=>{const c=cfg();$('go1').value=c.o||'';$('go2').value=c.r||'';$('go3').value=c.b||'main';$('go4').value=c.t||'';tg('set');};
$('sset').onclick=()=>{LS.cfg=JSON.stringify({o:$('go1').value.trim(),r:$('go2').value.trim(),b:$('go3').value.trim()||'main',t:$('go4').value.trim()});msg('Settings saved.');$('set').classList.add('hide');};
const tr=(q,a,b)=>fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${a}|${b}`).then(r=>r.json()).then(j=>(j.responseData.translatedText||'').trim());
async function pos(en){try{const j=await (await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(en))).json();
  return {verb:'verbs',noun:'nouns',adjective:'adjectives',adverb:'adverbs'}[j[0].meanings[0].partOfSpeech]||null;}catch{return null}}
async function typeOf(de,en){
  if(/^to\s+/i.test(en)||/^[a-zäöüß]+en$/.test(de))return 'verbs';
  if(/^(der|die|das)\s|^[A-ZÄÖÜ]/.test(de))return 'nouns';
  return (await pos(en))||guessType(de,en);}
async function resolve(raw){
  let de,en;
  if(/^to\s+/i.test(raw)){en=raw;de=await tr(raw,'en','de');}
  else{const r=await tr(raw,'de','en');
    if(norm(r)!==norm(raw)){de=raw;en=r;}else{de=await tr(raw,'en','de');en=raw;}}
  const type=await typeOf(de,en);
  if(type==='verbs'&&!/^to\s+/i.test(en))en='to '+en;
  return {de,en,type};
}
/* best-guess topic: is the English word among words related to the topic name? (free Datamuse API) */
const HINT={};
async function hint(t){if(!HINT[t]){try{HINT[t]=new Set((await (await fetch('https://api.datamuse.com/words?max=1000&ml='+encodeURIComponent(t))).json()).map(x=>x.word));}catch{HINT[t]=new Set();}}return HINT[t];}
async function guessTopic(en){
  const w=en.replace(/^to\s+/i,'').toLowerCase();
  for(const k in data.topics){if(k==='misc')continue;if((await hint(data.topics[k])).has(w))return k;}
  return 'misc';}
/* data changes are "ops": {op:'topic',key,title} or {op:'word',de,en,type,topic} */
function applyOp(d,o){
  if(o.op==='topic'){d.topics[o.key]=d.topics[o.key]||o.title;return;}
  if(o.list)o={de:o.de,en:o.en,type:TYPES[o.list]?o.list:guessType(o.de,o.en),topic:d.topics[o.list]?o.list:'misc'};
  if(!d.topics[o.topic])o.topic='misc';
  if(!d.words.some(w=>w.de===o.de&&norm(w.en)===norm(o.en)))d.words.push({de:o.de,en:o.en,type:o.type,topic:o.topic});
}
function addOp(o){applyOp(data,o);const p=JSON.parse(LS.pending||'[]');p.push(o);LS.pending=JSON.stringify(p);}
async function gh(c,pend){
  const url=`https://api.github.com/repos/${c.o}/${c.r}/contents/words.json`,H={Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'};
  const cur=await (await fetch(url+'?ref='+c.b,{headers:H})).json();if(!cur.sha)throw new Error(cur.message||'no file');
  const remote=migrate(JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g,''))))));
  pend.forEach(o=>applyOp(remote,o));
  const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Update words ('+pend.length+' changes)',content:btoa(unescape(encodeURIComponent(JSON.stringify(remote,null,1)))),sha:cur.sha,branch:c.b})});
  if(!r.ok)throw new Error((await r.json()).message);
}
async function persist(ok){
  render();const c=cfg(),pend=JSON.parse(LS.pending||'[]');
  if(!(c.t&&c.o&&c.r)){msg(ok+' Saved in this browser only – add GitHub settings to sync.');return;}
  try{await gh(c,pend);LS.pending='[]';msg(ok+' Saved to GitHub ✓ (site updates in ~1 min)');}
  catch(e){msg(ok+' GitHub save failed ('+e.message+'). Kept in this browser.');}
}
$('go').onclick=async()=>{
  const raw=$('w').value.trim();if(!raw)return;msg('Looking up…');
  try{const p=await resolve(raw),type=$('lt').value||p.type;
    $('pde').value=p.de;$('pen').value=p.en;$('pt').value=type;
    $('pp').value=$('lp').value||await guessTopic(p.en);$('prev').classList.remove('hide');
    msg('Check translation, type and topic (edit if needed), then save.');}
  catch(e){msg('Lookup failed: '+e.message);}
};
$('save').onclick=()=>{
  const de=$('pde').value.trim(),en=$('pen').value.trim();if(!de||!en)return;
  addOp({op:'word',de,en,type:$('pt').value,topic:$('pp').value});$('prev').classList.add('hide');$('w').value='';persist('Word added.');
};
/* file import: lines "German;English" or a single word. Optional header line "english;german" swaps columns. */
function parseFile(txt){
  const rows=txt.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  let swap=false;
  if(rows.length&&/^english\s*[;\t|=,]\s*german$/i.test(rows[0])){swap=true;rows.shift();}
  else if(rows.length&&/^german\s*[;\t|=,]\s*english$/i.test(rows[0]))rows.shift();
  return rows.map(r=>{const m=r.match(/^(.*?)\s*[;\t|=,]\s*(.+)$/);if(!m)return{one:r};
    let[a,b]=[m[1],m[2]];if(swap||/^to\s+/i.test(a))[a,b]=[b,a];return{de:a,en:b};});
}
async function importFile(file,topic){
  const rows=parseFile(await file.text());let n=0,bad=0;
  for(const[i,r]of rows.entries()){
    msg(`Processing ${i+1}/${rows.length}…`);
    try{let p=r;
      if(r.one){p=await resolve(r.one);await new Promise(s=>setTimeout(s,400));}
      else{p.type=await typeOf(p.de,p.en);if(p.type==='verbs'&&!/^to\s+/i.test(p.en))p.en='to '+p.en;}
      if(p.de&&p.en){addOp({op:'word',de:p.de,en:p.en,type:p.type,topic});n++;}else bad++;}catch{bad++;}
  }
  return{n,bad};
}
const rep=r=>`${r.n} words added`+(r.bad?` (${r.bad} failed)`:'')+'.';
$('tpg').onclick=async()=>{
  const name=$('tpn').value.trim();if(!name)return msg('Enter a topic name.');
  const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  if(!slug)return msg('Please use letters or numbers in the name.');
  const key='t_'+slug;if(data.topics[key])return msg('That topic already exists.');
  addOp({op:'topic',key,title:name});
  const f=$('tpf').files[0];let t=`Topic “${name}” created.`;
  if(f)t+=' '+rep(await importFile(f,key));
  $('tpn').value='';$('tpf').value='';persist(t);
};
$('tfg').onclick=async()=>{
  const f=$('tff').files[0];if(!f)return msg('Choose a file first.');
  const t=rep(await importFile(f,$('tfs').value));$('tff').value='';persist(t);
};
load();</script></body></html>
